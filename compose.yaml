services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: scanorder
      POSTGRES_PASSWORD: scanorder
      POSTGRES_DB: scanorder
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scanorder -d scanorder']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
