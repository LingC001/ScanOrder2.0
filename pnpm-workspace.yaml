packages:
  - apps/*
  - packages/*

allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@nestjs/core': true
  '@tailwindcss/oxide': true
  embedded-postgres: true
  esbuild: true
  # postinstall 仅检查依赖版本约定，不下载或生成二进制。
  protobufjs: true

minimumReleaseAgeExclude:
  - '@nestjs/common@12.2.0'
  - '@nestjs/core@12.2.0'
  - '@nestjs/platform-express@12.2.0'
  - '@fission-ai/openspec@2.1.0'
  - marked@18.2.1
