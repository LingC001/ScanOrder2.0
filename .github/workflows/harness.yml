name: 工程验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  OPENSPEC_TELEMETRY: '0'

jobs:
  observability:
    name: 隔离运行与遥测验收
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/harness/verify.mjs observability
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness-observability
          path: |
            .local/harness/*.json
            .local/harness/*.md
            .local/harness/*.log
            .local/harness/evaluations/
          include-hidden-files: true
          if-no-files-found: warn
  quality:
    name: 基础验证（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
          run_install: false
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 执行 Ubuntu 基础验证及生成文档校验
        if: runner.os == 'Linux'
        run: pnpm verify
      - name: 执行 Windows 基础验证
        if: runner.os == 'Windows'
        run: node scripts/harness/verify.mjs windows-ci
      - name: 保存验证日志和报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-${{ matrix.os }}
          path: |
            .local/harness/*.json
            .local/harness/*.md
            .local/harness/*.log
            .local/harness/evaluations/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: 真实 PostgreSQL 集成测试
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
          run_install: false
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 执行隔离数据库测试
        run: node scripts/harness/verify.mjs integration
      - name: 保存验证日志和报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-integration
          path: |
            .local/harness/*.json
            .local/harness/*.md
            .local/harness/*.log
            .local/harness/evaluations/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Chromium 业务回归
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
          run_install: false
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Chromium 与系统依赖
        run: pnpm exec playwright install --with-deps chromium
      - name: 执行隔离浏览器测试
        run: node scripts/harness/verify.mjs e2e
      - name: 保存浏览器证据和验证日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-e2e
          path: |
            .local/harness/*.json
            .local/harness/*.md
            .local/harness/*.log
            .local/harness/evaluations/
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  merge-gate:
    name: Harness 合入检查
    needs: [quality, integration, e2e, observability]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 汇总必需作业结果
        env:
          HARNESS_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = Object.entries(JSON.parse(process.env.HARNESS_JOB_RESULTS));
          if (jobs.length === 0) throw new Error('缺少必需作业结果。');
          for (const [name, job] of jobs) {
            console.log(`${name} = ${job.result}`);
            if (job.result !== 'success') process.exitCode = 1;
          }
          NODE
